<div id="risen-canvas-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>
<script>
let t = 0.0;
let vel = 0.02;
let cubes = [];
let count = 8;           // 网格密度
let palette;
let targetCount = 7;

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(random(i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function setup() {
  let canvas = createCanvas(windowWidth, windowHeight, WEBGL);
  canvas.parent('risen-canvas-container');
  colorMode(HSB, 360, 100, 100, 255);
  rectMode(CENTER);
  angleMode(DEGREES);
  
  palette = [
    color(50, 45, 90),  // 浓郁金  
    color(55, 40, 85),  // 暖金  
    color(45, 50, 88),  // 亮金  
    color(52, 35, 92),  // 淡金  
    color(48, 55, 80),  // 深金  
    color(58, 30, 95),  // 浅金
    color(42, 60, 75),  // 古铜金 
  ];
  
  // 调整候选区域：只取右上角靠近边缘的部分，避免中心
  let candidates = [];
  // 让 i, j, k 的范围在 count*0.6 到 count*0.9 之间，这样更聚集在右上角但不超出视野
  let minIdx = Math.floor(count * 0.6);
  let maxIdx = Math.floor(count * 0.9);
  for (let k = minIdx; k <= maxIdx; k++) {
    for (let j = minIdx; j <= maxIdx; j++) {
      for (let i = minIdx; i <= maxIdx; i++) {
        candidates.push({i, j, k});
      }
    }
  }
  
  candidates = shuffleArray(candidates);
  let selected = candidates.slice(0, targetCount);
  
  let spacing = min(width, height) / count * 1.2;  // 加大间距，避免重叠
  let baseSize = spacing * 1.5;   // 加大基础尺寸
  
  for (let p of selected) {
    let {i, j, k} = p;
    
    let phaseX = random(1000);
    let phaseY = random(1000);
    let phaseZ = random(1000);
    let phaseSizeX = random(1000);
    let phaseSizeY = random(1000);
    let phaseSizeZ = random(1000);
    
    let col = palette[int(random(palette.length))];
    
    let sizeFactorX = random(0.7, 1.3);
    let sizeFactorY = random(0.7, 1.3);
    let sizeFactorZ = random(0.7, 1.3);
    
    let alphaBase = random(80, 150);
    
    cubes.push({
      i, j, k,
      phaseX, phaseY, phaseZ,
      phaseSizeX, phaseSizeY, phaseSizeZ,
      sizeFactorX, sizeFactorY, sizeFactorZ,
      col,
      alphaBase
    });
  }
}

function draw() {
  background(0, 0, 0, 10);
  
  // 调整相机：拉远一点，确保所有立方体可见
  // 设置透视或正交？使用透视可能更自然。这里用透视，并调整相机位置
  // 默认相机在 (0,0,0) 看向 (0,0,0)，需要移动相机才能看到所有物体
  // 我们可以平移场景而不是移动相机
  // 或者使用 ortho 但调整参数
  // 保持 ortho，并调整相机参数
  ortho(-width/2, width/2, -height/2, height/2, -10000, 10000); // 扩展裁剪面
  
  // 旋转视角
  rotateX(-35);
  rotateY(45);
  
  // 将整个场景向左下角平移，使得右上角的立方体位于画布中央偏右上
  // 计算场景中心偏移：让立方体聚集区中心移动到视口中心偏右上
  let spacing = min(width, height) / count * 1.2;
  // 聚集区的中心坐标（在网格坐标系中）
  let centerI = count * 0.75; // 近似 0.6~0.9 的中心
  let centerJ = count * 0.75;
  let centerK = count * 0.75;
  
  // 应用平移，使得这个中心移动到画布中心偏右上？实际上我们希望立方体出现在右上角，所以应该让场景整体向左下移动，这样网格的右上部分就跑到画布中心了
  // 计算偏移量：将 (centerI - count/2) * spacing 这个坐标移动到视口中心？简单起见，我们直接平移场景，让立方体集中在视口右上区域
  // 我们可以设置一个平移量，比如将原点移动到 ( -width*0.2, -height*0.2, 0 ) 这样所有物体会向右上移动
  // 但更好的做法是直接在 translate 中调整每个立方体的位置，或者整体平移场景
  // 这里采用整体平移：
  push();
  // 平移场景，使立方体聚集区位于视口中心偏右上
  translate(width * 0.2, height * 0.2, 0); // 调整这些值来控制偏移
  
  for (let c of cubes) {
    let xmove = sin(t * 10 + c.phaseX) * 3.0;
    let ymove = cos(t * 8 + c.phaseY) * 3.0;
    let zmove = sin(t * 12 + c.phaseZ) * 3.0;
    
    let breathX = sin(t * 8 + c.phaseSizeX) * 0.5 + 1.0;
    let breathY = sin(t * 7 + c.phaseSizeY) * 0.5 + 1.0;
    let breathZ = sin(t * 9 + c.phaseSizeZ) * 0.5 + 1.0;
    
    let currentSizeX = spacing * c.sizeFactorX * breathX;
    let currentSizeY = spacing * c.sizeFactorY * breathY;
    let currentSizeZ = spacing * c.sizeFactorZ * breathZ;
    
    push();
    translate(
      (c.i - count/2) * spacing + xmove,
      (c.j - count/2) * spacing + ymove,
      (c.k - count/2) * spacing + zmove
    );
    
    let col = c.col;
    col.setAlpha(c.alphaBase * (0.8 + 0.2 * sin(t * 5 + c.phaseX)));
    fill(col);
    noStroke();
    box(currentSizeX, currentSizeY, currentSizeZ);
    
    push();
    noFill();
    stroke(c.col);
    strokeWeight(1.8);
    box(currentSizeX * 1.03, currentSizeY * 1.03, currentSizeZ * 1.03);
    pop();
    
    pop();
  }
  
  pop(); // 恢复平移
  
  t += vel;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
