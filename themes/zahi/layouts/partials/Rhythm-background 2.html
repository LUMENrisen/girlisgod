<!-- 动态风背景 - 粒子流版 -->
<div id="wind-canvas-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>

<script>
function setup() {
  const canvas = createCanvas(windowWidth, windowHeight);
  canvas.parent('wind-canvas-container');
  
  // 设置颜色模式
  colorMode(HSB, 360, 100, 100, 255);
  
  // 不描边，只填充
  noStroke();
  
  // 初始化粒子
  initParticles();
}

let particles = [];
let amount = 600; // 粒子数量，可以调整
let noiseScale = 0.005;

function initParticles() {
  for (let i = 0; i < amount; i++) {
    let pos = createVector(random(width), random(height));
    particles.push(pos);
  }
}

function draw() {
  // 极淡的黑色背景，让粒子留下轨迹
  // 用很小的透明度，让轨迹慢慢消失，形成流动感
  background(0, 0, 0, 4);
  
  // 金色系：色相50左右
  const goldHue = 50;
  
  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    
    // 根据粒子的位置和帧数计算颜色
    // 越靠右的粒子颜色越亮，增加方向感
    let brightness = 70 + map(p.x, 0, width, 0, 20);
    let alpha = 50 + map(p.x, 0, width, 0, 30);
    
    fill(goldHue, 20, brightness, 10);
    circle(p.x, p.y, 5);
    
    // 噪声算法，产生流动的力场
    let n = noise(p.x * noiseScale, p.y * noiseScale, frameCount * 0.01);
    let a = TWO_PI * n;
    
    // 主要流动方向：向右
    // sin(a) 产生左右分量，这里用绝对值让粒子主要向右
    p.x += sin(a) * 1.2 + 0.5; // 加一个常数0.5，确保总体向右
    
    // 垂直方向有轻微的波动，像风吹的起伏
    p.y += cos(a) * 0.8;
    
    // 如果粒子超出屏幕，重置到左侧
    if (p.x > width + 10) {
      p.x = -10;
      p.y = random(height);
    } else if (p.x < -10) {
      p.x = width + 10;
    }
    
    if (p.y > height + 10 || p.y < -10) {
      p.y = random(height);
    }
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  // 重置粒子位置，适应新窗口
  particles = [];
  initParticles();
}
</script>
