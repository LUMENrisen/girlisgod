	<!-- 回到顶部按钮 - 右上角 -空心金色描边-->
	<a href="#" id="back-to-top" class="back-to-top" style="display: none; position: fixed; top: 20px; right: 20px; width: 40px; height: 40px; border: 2px solid #c9a959; color: #c9a959; border-radius: 50%; text-align: center; line-height: 36px; font-size: 24px; text-decoration: none; z-index: 9999; background-color: transparent; transition: all 0.3s;">↑</a>
	
	<script>
  		document.addEventListener('DOMContentLoaded', function() {
    		const backToTop = document.getElementById('back-to-top');
    
    		// 显示/隐藏按钮
    		window.addEventListener('scroll', function() {
      			if (window.scrollY > 300) {
        			backToTop.style.display = 'block';
      			} else {
        			backToTop.style.display = 'none';
      			}
    		});
    
    		// 点击返回顶部
    		backToTop.addEventListener('click', function(e) {
      			e.preventDefault();
      			window.scrollTo({
        			top: 0,
        			behavior: 'smooth'
      			});
    		});
  		});
	</script>
