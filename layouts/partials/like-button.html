<button id="like-btn" class="inline-flex items-center gap-1 bg-stone-800/50 text-stone-400 px-3 py-1 rounded-full text-sm hover:bg-stone-700/50 transition-colors">
  <span id="like-text">点亮</span>
  <svg id="like-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
  </svg>
  
</button>

<script>
(function() {
  const btn = document.getElementById('like-btn');
  const icon = document.getElementById('like-icon');
  const text = document.getElementById('like-text');
  const key = 'liked_' + window.location.pathname;
  const liked = localStorage.getItem(key) === 'true';
  
  if (liked) {
    btn.classList.add('text-gold-500');
    text.innerText = '已点亮';
    icon.setAttribute('fill', 'currentColor');
  }
  
  btn.addEventListener('click', () => {
    const nowLiked = localStorage.getItem(key) === 'true';
    if (nowLiked) {
      localStorage.setItem(key, 'false');
      btn.classList.remove('text-gold-500');
      text.innerText = '点亮';
      icon.setAttribute('fill', 'none');
    } else {
      localStorage.setItem(key, 'true');
      btn.classList.add('text-gold-500');
      text.innerText = '已点亮';
      icon.setAttribute('fill', 'currentColor');
    }
  });
})();
</script>
